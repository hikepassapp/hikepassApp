name: hikepass_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  get: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_native_splash:
  color: "#179778"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#179778"
    image: assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  background_color: "#ffffff"
